name: Validate issue submissions

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: submission-${{ github.event.issue.number || 'labels' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const review = require('./scripts/validate-submission.cjs');
            await review.run({ github, context });
