name: Submit a resource
description: Suggest a Codex resource for review. Do not open a pull request.
title: "[Resource] "
labels: [resource-submission, validation-pending]
body:
  - type: markdown
    attributes:
      value: |
        Submit one resource per issue. Eligible resources are free and open, work with Codex CLI, and have 100+ GitHub stars.
        Resources below that are reviewed on distinctiveness and quality. See contributing.md for details.
        The automated check only confirms the form is complete; maintainers make the inclusion decision.
  - type: input
    id: project
    attributes:
      label: Project name and URL
      description: Canonical repository or project website.
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Suggested README section
      placeholder: "e.g., Session Managers"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Factual description
      description: One neutral line on what it does. No marketing.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Codex integration evidence
      description: Link to code or docs that show Codex support.
    validations:
      required: true
  - type: textarea
    id: adoption
    attributes:
      label: External usage evidence
      description: Link to the GitHub repo (stars and first-commit date are checked from it), or a third-party listing or download count.
    validations:
      required: true
  - type: input
    id: relationship
    attributes:
      label: Your relationship to the project
      description: Author, contributor, or user.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the README and existing issues for duplicates.
          required: true
        - label: The project is free and open, and its Codex support works as described.
          required: true
        - label: I have read contributing.md.
          required: true
